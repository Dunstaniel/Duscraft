function render(filter=''){

      e.en.toLowerCase().includes(filter.toLowerCase()) ||
      e.pl.toLowerCase().includes(filter.toLowerCase())
   )
   .forEach(e => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${e.en}</td>
        <td>${e.pl}</td>
        <td>${e.tool}</td>
        <td>${e.desc}</td>
        <td>${e.comp}</td>
      `;
      tbody.appendChild(row);
   });
}
